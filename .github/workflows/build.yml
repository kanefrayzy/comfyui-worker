name: build-and-push

# Собирает Docker-образ и пушит в Docker Hub при каждом push в main.
# Нужны secrets в настройках репозитория:
#   DOCKERHUB_USERNAME — твой логин Docker Hub
#   DOCKERHUB_TOKEN    — Access Token (Docker Hub -> Account Settings -> Security)

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # ручной запуск кнопкой в Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/comfyui-epicrealism-pulid:v3
